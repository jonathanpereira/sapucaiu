document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"5498eafd-9513-4962-949e-73f6194400e1\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"a0f1bbec-e66b-4e57-80ed-321b1c06c81d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"5498eafd-9513-4962-949e-73f6194400e1\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Figtree';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a0f1bbec-e66b-4e57-80ed-321b1c06c81d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f5ead8;\n  --color-surface: #ebddc5;\n  --color-text: #201e1d;\n  --color-accent: #c67139;\n  --color-accent-2: #7a8a5e;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f9f4ed;\n  --color-neutral-200: #eee7db;\n  --color-neutral-300: #dcd3c4;\n  --color-neutral-400: #c0b6a5;\n  --color-neutral-500: #a19786;\n  --color-neutral-600: #82796a;\n  --color-neutral-700: #645c50;\n  --color-neutral-800: #474238;\n  --color-neutral-900: #2e2b25;\n\n  --color-accent-100: #fff2eb;\n  --color-accent-200: #ffe1d0;\n  --color-accent-300: #ffc6a5;\n  --color-accent-400: #f6a06b;\n  --color-accent-500: #d67f48;\n  --color-accent-600: #b2622d;\n  --color-accent-700: #8c491a;\n  --color-accent-800: #643312;\n  --color-accent-900: #402310;\n\n  --color-accent-2-100: #f0fae1;\n  --color-accent-2-200: #e1eecc;\n  --color-accent-2-300: #ccdbb2;\n  --color-accent-2-400: #aebf92;\n  --color-accent-2-500: #8fa073;\n  --color-accent-2-600: #728157;\n  --color-accent-2-700: #56633f;\n  --color-accent-2-800: #3d472b;\n  --color-accent-2-900: #272e1b;\n\n  --font-heading: \"Caprasimo\", system-ui, sans-serif;\n  --font-heading-weight: 400;\n  --font-body: \"Figtree\", system-ui, sans-serif;\n\n  --space-1: 4.4px;\n  --space-2: 8.8px;\n  --space-3: 13.2px;\n  --space-4: 17.6px;\n  --space-6: 26.4px;\n  --space-8: 35.2px;\n\n  --radius-sm: 8px;\n  --radius-md: 16px;\n  --radius-lg: 28px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2e2b25 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2e2b25 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2e2b25 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.washed{filter:saturate(0.6) contrast(0.85) brightness(1.1) opacity(0.94)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .inpu {{ e.dayLabel }}<\u002Fspan>\n<span style=\"flex:1;min-width:0\">\n<span style=\"display:block;font:600 14px 'Figtree',system-ui\">{{ e.title }}<\u002Fspan>\n<span style=\"display:block;font-size:11px;color:var(--color-neutral-700)\">{{ e.sub }}<\u002Fspan>\n<\u002Fspan>\n<span style=\"flex:none;color:var(--color-neutral-600);font-size:15px\">›<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ lockOrg }}\" style=\"min-height:44px;margin-top:20px;width:100%;max-width:320px\">Organisator-Modus verlassen<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isOrgForm }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"max-width:1060px;margin:0 auto;padding:24px clamp(16px,4vw,32px) 72px\">\n<button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ backToOrgList }}\" style=\"padding-left:0;margin-bottom:2px;color:var(--color-accent-700)\">← Organisator<\u002Fbutton>\n<div style=\"display:flex;align-items:baseline;gap:8px;margin-bottom:10px\">\n<h2 style=\"font-size:26px;margin:0\">{{ orgFormTitle }}<\u002Fh2>\n<\u002Fdiv>\n<div style=\"max-width:660px\">\n<div class=\"field\" style=\"margin-bottom:12px\"><label>Titel<\u002Flabel><input class=\"input\" placeholder=\"z.B. Berlin Samba Parade\" value=\"{{ f.title }}\" sc-camel-on-change=\"{{ onF.title }}\" style=\"min-height:44px\"><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px\">\n<div class=\"field\"><label>Datum<\u002Flabel><input class=\"input\" type=\"date\" value=\"{{ f.date }}\" sc-camel-on-change=\"{{ onF.date }}\" style=\"min-height:44px\"><\u002Fdiv>\n<div class=\"field\"><label>Ankunftszeit<\u002Flabel><input class=\"input\" type=\"time\" value=\"{{ f.ankunft }}\" sc-camel-on-change=\"{{ onF.ankunft }}\" style=\"min-height:44px\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px\">\n<div class=\"field\"><label>Showtime<\u002Flabel><input class=\"input\" type=\"time\" value=\"{{ f.show }}\" sc-camel-on-change=\"{{ onF.show }}\" style=\"min-height:44px\"><\u002Fdiv>\n<div class=\"field\"><label>Ende (ca.)<\u002Flabel><input class=\"input\" type=\"time\" value=\"{{ f.ende }}\" sc-camel-on-change=\"{{ onF.ende }}\" style=\"min-height:44px\"><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"field\" style=\"margin-bottom:12px\"><label>Ort<\u002Flabel><input class=\"input\" placeholder=\"Stadtteil, Strecke oder Location\" value=\"{{ f.place }}\" sc-camel-on-change=\"{{ onF.place }}\" style=\"min-height:44px\"><\u002Fdiv>\n<div class=\"field\" style=\"margin-bottom:12px\"><label>Treffpunkt<\u002Flabel><input class=\"input\" placeholder=\"Genauer Treffpunkt\" value=\"{{ f.treff }}\" sc-camel-on-change=\"{{ onF.treff }}\" style=\"min-height:44px\"><\u002Fdiv>\n<div class=\"field\" style=\"margin-bottom:12px\"><label>Google-Maps-Link zum Treffpunkt<\u002Flabel><input class=\"input\" placeholder=\"https://maps.app.goo.gl/…\" value=\"{{ f.maps }}\" sc-camel-on-change=\"{{ onF.maps }}\" style=\"min-height:44px\"><\u002Fdiv>\n<div class=\"field\" style=\"margin-bottom:12px\"><label>Outfit<\u002Flabel><input class=\"input\" placeholder=\"z.B. Gelb-grüne Fantasia\" value=\"{{ f.outfit }}\" sc-camel-on-change=\"{{ onF.outfit }}\" style=\"min-height:44px\"><\u002Fdiv>\n<div class=\"field\" style=\"margin-bottom:12px\"><label>Setlist-Link<\u002Flabel><input class=\"input\" placeholder=\"https://…\" value=\"{{ f.setlist }}\" sc-camel-on-change=\"{{ onF.setlist }}\" style=\"min-height:44px\"><\u002Fdiv>\n<div class=\"field\" style=\"margin-bottom:18px\"><label>Kontakt vor Ort<\u002Flabel><input class=\"input\" placeholder=\"Name · Telefonnummer\" value=\"{{ f.kontakt }}\" sc-camel-on-change=\"{{ onF.kontakt }}\" style=\"min-height:44px\"><\u002Fdiv>\n\n<div style=\"border-top:1px solid var(--color-divider);padding-top:16px\">\n<h4 style=\"font-size:18px;margin:0 0 8px\">Probentermine<\u002Fh4>\n<div style=\"display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ orgEnsaios }}\" as=\"t\" hint-placeholder-count=\"4\">\n<div style=\"background:var(--color-surface);border-radius:24px;padding:11px 12px\">\n<div style=\"display:flex;align-items:center;gap:8px\">\n<input class=\"input\" type=\"date\" value=\"{{ t.date }}\" sc-camel-on-change=\"{{ t.onDate }}\" style=\"flex:1;min-height:40px;background:var(--color-bg)\">\n<input class=\"input\" type=\"time\" value=\"{{ t.time }}\" sc-camel-on-change=\"{{ t.onTime }}\" style=\"width:104px;min-height:40px;background:var(--color-bg)\">\n<button sc-camel-on-click=\"{{ t.remove }}\" style=\"width:32px;height:32px;flex:none;border-radius:999px;border:1px solid var(--color-divider);background:transparent;cursor:pointer;color:var(--color-neutral-700);font-size:15px\" style-hover=\"background:var(--color-accent-100);color:var(--color-accent-700)\">×<\u002Fbutton>\n<\u002Fdiv>\n<input class=\"input\" placeholder=\"Ort der Probe\" value=\"{{ t.place }}\" sc-camel-on-change=\"{{ t.onPlace }}\" style=\"margin-top:8px;min-height:40px;background:var(--color-bg)\">\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<button class=\"btn btn-secondary btn-block\" sc-camel-on-click=\"{{ addEnsaio }}\" style=\"min-height:44px;margin-top:10px\">+ Termin hinzufügen<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"display:flex;gap:9px;margin-top:20px\">\n<button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ backToOrgList }}\" style=\"flex:1;min-height:48px\">Abbrechen<\u002Fbutton>\n<button class=\"btn btn-primary\" sc-camel-on-click=\"{{ saveOrg }}\" style=\"flex:2;min-height:48px;font-size:15px\">{{ saveLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst INSTRUMENTS = [\"Tamborim\",\"Caixa\",\"Repinique\",\"Surdo 1a\",\"Surdo 2a\",\"Surdo 3a\",\"Agogô\",\"Ripa\",\"Chocalho\",\"Cuíca\",\"Timbal\"];\nconst PIN = \"1312\";\n\nconst MEMBERS = [\n  {n:\"Ana Beatriz Rocha\",k:\"Tanz\"},\n  {n:\"Bruno Kessler\",k:\"Bateria\",i:\"Repinique\"},\n  {n:\"Carla Nunes\",k:\"Tanz\"},\n  {n:\"Daniel Ostrowski\",k:\"Bateria\",i:\"Surdo 2a\"},\n  {n:\"Elif Yalçın\",k:\"Bateria\",i:\"Caixa\"},\n  {n:\"Fernanda Lima\",k:\"Tanz\"},\n  {n:\"Greta Hoffmann\",k:\"Bateria\",i:\"Tamborim\"},\n  {n:\"Hendrik Vogel\",k:\"Bateria\",i:\"Chocalho\"},\n  {n:\"Isabel Moreira\",k:\"Tanz\"},\n  {n:\"Jonas Kraus\",k:\"Bateria\",i:\"Agogô\"},\n  {n:\"Katja Brandt\",k:\"Tanz\"},\n  {n:\"Lucas Ferreira\",k:\"Bateria\",i:\"Caixa\"},\n  {n:\"Marcia Alves\",k:\"Tanz\"},\n  {n:\"Nuno Batista\",k:\"Bateria\",i:\"Ripa\"},\n  {n:\"Paula Wiedemann\",k:\"Bateria\",i:\"Tamborim\"},\n  {n:\"Sofia Duarte\",k:\"Tanz\"},\n];\n\nconst EVENTS = [\n  {id:\"parade\",title:\"Berlin Samba Parade\",day:\"24\",mon:\"OKT\",dateLabel:\"Sa 24. Oktober\",place:\"Kreuzberg\",treff:\"Hermannplatz, Ecke Urbanstraße\",maps:\"https://maps.google.com/?q=Hermannplatz+Berlin\",ankunft:\"10:30 Uhr\",show:\"13:15 Uhr · Startnummer 14\",outfit:\"Gelb-grüne Fantasia, weiße Schuhe\",setlist:\"Setlist 2026 (Drive)\",kontakt:\"Marcia · +49 176 2233 118\",ja:23,total:31,past:false,\n    ensaios:[{id:\"e1\",date:\"2026-10-06\",time:\"19:30\",place:\"Saal Weichselstraße\"},{id:\"e2\",date:\"2026-10-13\",time:\"19:30\",place:\"Saal Weichselstraße\"},{id:\"e3\",date:\"2026-10-18\",time:\"14:00\",place:\"Generalprobe Mauerpark\"},{id:\"e4\",date:\"2026-10-23\",time:\"18:00\",place:\"Kurz-Check & Outfit\"}]},\n  {id:\"ballhaus\",title:\"Sambanacht im Ballhaus\",day:\"14\",mon:\"NOV\",dateLabel:\"Sa 14. November\",place:\"Ballhaus Rixdorf\",treff:\"Bühneneingang Hinterhof\",maps:\"https://maps.google.com/?q=Ballhaus+Rixdorf+Berlin\",ankunft:\"18:45 Uhr\",show:\"20:30 Uhr\",outfit:\"Schwarz mit gelbem Gürtel\",setlist:\"Setlist Ballhaus (Drive)\",kontakt:\"Bruno · +49 151 8890 442\",ja:14,total:31,past:false,\n    ensaios:[{id:\"e1\",date:\"2026-11-03\",time:\"19:30\",place:\"Saal Weichselstraße\"},{id:\"e2\",date:\"2026-11-10\",time:\"19:30\",place:\"Saal Weichselstraße\"}]},\n  {id:\"roda\",title:\"Weihnachts-Roda\",day:\"11\",mon:\"DEZ\",dateLabel:\"Fr 11. Dezember\",place:\"Kulturbrauerei, Prenzlauer Berg\",treff:\"Kesselhaus, Seiteneingang\",ankunft:\"17:30 Uhr\",show:\"19:00 Uhr\",outfit:\"Freie Wahl, Vereins-Shirt\",setlist:\"Roda-Repertoire\",kontakt:\"Katja · +49 170 3344 019\",ja:9,total:31,past:false,\n    ensaios:[{id:\"e1\",date:\"2026-12-08\",time:\"19:30\",place:\"Saal Weichselstraße\"}]},\n  {id:\"kdk\",title:\"Karneval der Kulturen\",day:\"24\",mon:\"MAI\",dateLabel:\"So 24. Mai\",place:\"Kreuzberg\",treff:\"Hermannplatz\",ankunft:\"10:00 Uhr\",show:\"12:40 Uhr\",outfit:\"Fantasia 2026\",setlist:\"Setlist KdK\",kontakt:\"Marcia\",ja:29,total:31,past:true,ensaios:[{id:\"e1\",date:\"2026-05-05\",time:\"19:30\",place:\"Saal Weichselstraße\"},{id:\"e2\",date:\"2026-05-12\",time:\"19:30\",place:\"Saal Weichselstraße\"},{id:\"e3\",date:\"2026-05-17\",time:\"14:00\",place:\"Generalprobe Tempelhofer Feld\"},{id:\"e4\",date:\"2026-05-21\",time:\"19:00\",place:\"Outfit-Check Weichselstraße\"}]},\n  {id:\"fete\",title:\"Fête de la Musique\",day:\"21\",mon:\"JUN\",dateLabel:\"So 21. Juni\",place:\"Tempelhofer Feld\",treff:\"Eingang Oderstraße\",ankunft:\"16:00 Uhr\",show:\"17:30 Uhr\",outfit:\"Weiß & Gelb\",setlist:\"Setlist Fête\",kontakt:\"Jonas\",ja:21,total:31,past:true,ensaios:[{id:\"e1\",date:\"2026-06-09\",time:\"19:30\",place:\"Saal Weichselstraße\"},{id:\"e2\",date:\"2026-06-16\",time:\"19:30\",place:\"Saal Weichselstraße\"}]},\n  {id:\"sommer\",title:\"Sommerfest Kulturbrauerei\",day:\"15\",mon:\"AUG\",dateLabel:\"Sa 15. August\",place:\"Prenzlauer Berg\",treff:\"Kesselhaus\",ankunft:\"15:30 Uhr\",show:\"17:00 Uhr\",outfit:\"Vereins-Shirt\",setlist:\"Sommer-Set\",kontakt:\"Bruno\",ja:18,total:31,past:true,ensaios:[{id:\"e1\",date:\"2026-08-04\",time:\"19:30\",place:\"Saal Weichselstraße\"},{id:\"e2\",date:\"2026-08-11\",time:\"19:30\",place:\"Saal Weichselstraße\"},{id:\"e3\",date:\"2026-08-13\",time:\"18:30\",place:\"Kurzprobe Kesselhaus\"}]},\n];\n\nconst RSVP_SEED = MEMBERS.map(() => null);\nconst ENS_SEED = MEMBERS.map(() => [null,null,null,null,null,null]);\n\nconst MON = [\"JAN\",\"FEB\",\"MÄR\",\"APR\",\"MAI\",\"JUN\",\"JUL\",\"AUG\",\"SEP\",\"OKT\",\"NOV\",\"DEZ\"];\nconst MON_LONG = [\"Januar\",\"Februar\",\"März\",\"April\",\"Mai\",\"Juni\",\"Juli\",\"August\",\"September\",\"Oktober\",\"November\",\"Dezember\"];\nconst WD = [\"So\",\"Mo\",\"Di\",\"Mi\",\"Do\",\"Fr\",\"Sa\"];\nconst EMPTY_FORM = { title:\"\", date:\"\", ankunft:\"\", show:\"\", ende:\"\", place:\"\", treff:\"\", maps:\"\", outfit:\"\", setlist:\"\", kontakt:\"\" };\n\nconst probeLabel = (t) => {\n  if (!t.date) return \"Datum offen\";\n  const d = new Date(t.date + \"T12:00:00\");\n  return WD[d.getDay()] + \" \" + d.getDate() + \". \" + MON_LONG[d.getMonth()].slice(0,3);\n};\nconst joinDot = (...parts) => parts.filter(p => p && String(p).trim()).join(\" · \");\nconst initials = (n) => n.split(\" \").map(p => p[0]).slice(0,2).join(\"\");\nconst AV = [\n  [\"var(--samba-100)\",\"var(--samba-700)\"],\n  [\"var(--color-accent-2-200)\",\"var(--color-accent-2-800)\"],\n  [\"var(--color-accent-200)\",\"var(--color-accent-800)\"],\n];\n\nclass Component extends DCLogic {\n  state = {\n    screen: \"name\", user: null, query: \"\", tab: \"next\", eventId: \"parade\",\n    newName: \"\",\n    rsvp: {}, comment: {}, ensaio: {}, evRole: {}, evInstr: {}, infoOpen: false, ovFilter: \"alle\",\n    pin: \"\", pinErr: false, orgUnlocked: false, saved: false,\n    orgEnsaios: EVENTS[0].ensaios.map(e => ({...e})),\n    events: EVENTS.map(e => ({...e})),\n    orgView: \"list\", orgNew: false, orgEditId: null, form: {...EMPTY_FORM},\n  };\n\n  go = (screen) => this.setState({ screen });\n  ev = () => this.state.events.find(e => e.id === this.state.eventId) || this.state.events[0];\n\n  formFrom(e) {\n    let iso = e.iso;\n    if (!iso && e.mon) {\n      const mi = MON.indexOf(e.mon);\n      if (mi >= 0) iso = \"2026-\" + String(mi + 1).padStart(2, \"0\") + \"-\" + String(e.day).padStart(2, \"0\");\n    }\n    return { title:e.title, date:iso || \"\", ankunft:(e.ankunft||\"\").slice(0,5), show:(e.show||\"\").slice(0,5),\n      ende:e.ende || \"\", place:e.place, treff:e.treff, maps:e.maps || \"\", outfit:e.outfit, setlist:e.setlist, kontakt:e.kontakt };\n  }\n  commitEvent = () => {\n    const f = this.state.form, iso = f.date;\n    const d = iso ? new Date(iso + \"T12:00:00\") : null;\n    const patch = {\n      title: f.title.trim() || \"Neues Event\", iso,\n      day: d ? String(d.getDate()) : \"–\", mon: d ? MON[d.getMonth()] : \"\",\n      dateLabel: d ? WD[d.getDay()] + \" \" + d.getDate() + \". \" + MON_LONG[d.getMonth()] : \"Datum offen\",\n      place: f.place.trim(), treff: f.treff.trim() || \"—\", maps: f.maps.trim(), ankunft: f.ankunft ? f.ankunft + \" Uhr\" : \"—\",\n      show: f.show ? f.show + \" Uhr\" : \"—\", ende: f.ende, outfit: f.outfit.trim() || \"—\",\n      setlist: f.setlist || \"Setlist folgt\", kontakt: f.kontakt.trim() || \"—\",\n      ensaios: this.state.orgEnsaios.map(t => ({...t})),\n    };\n    this.setState(s => {\n      if (s.orgNew) {\n        const id = \"ev\" + Date.now();\n        return { events: [{ id, ja:0, total:31, past:false, ...patch }].concat(s.events),\n          eventId: id, orgNew:false, orgEditId:id, saved:true };\n      }\n      return { events: s.events.map(e => (e.id === s.orgEditId ? {...e, ...patch} : e)), saved:true };\n    });\n  };\n\n  bigBtn(active, tone) {\n    const bg = { ja:\"var(--color-accent-2)\", nein:\"var(--color-neutral-700)\", viel:\"var(--samba)\" }[tone];\n    const fg = tone === \"viel\" ? \"var(--samba-700)\" : \"#fff\";\n    return \"min-height:62px;border-radius:22px;cursor:pointer;font-family:'Caprasimo',serif;font-size:16px;line-height:1.1;\"\n      + (active\n        ? `background:${bg};color:${tone===\"viel\"?\"#3a2905\":fg};border:2px solid ${bg};box-shadow:var(--shadow-md)`\n        : `background:transparent;color:var(--color-text);border:2px solid var(--color-divider)`);\n  }\n  miniBtn(active, tone) {\n    const bg = { ja:\"var(--color-accent-2)\", nein:\"var(--color-neutral-700)\", viel:\"var(--samba)\" }[tone];\n    return \"width:34px;height:34px;border-radius:999px;cursor:pointer;font:600 13px 'Figtree',system-ui;\"\n      + (active ? `background:${bg};color:${tone===\"viel\"?\"#3a2905\":\"#fff\"};border:1.5px solid ${bg}`\n                : \"background:transparent;color:var(--color-neutral-700);border:1.5px solid var(--color-divider)\");\n  }\n  pillTab(active) {\n    return \"min-height:38px;border-radius:999px;cursor:pointer;font:600 13.5px 'Figtree',system-ui;border:none;\"\n      + (active ? \"background:var(--color-bg);color:var(--color-text);box-shadow:var(--shadow-sm)\"\n                : \"background:transparent;color:var(--color-neutral-700)\");\n  }\n  navBtn(active) {\n    return \"padding:8px 16px;min-height:38px;border-radius:999px;border:none;cursor:pointer;font:600 13px 'Figtree',system-ui;\"\n      + (active ? \"background:var(--color-accent);color:#fff\" : \"background:var(--color-surface);color:var(--color-neutral-800)\");\n  }\n  choiceBtn(active) {\n    return \"min-height:52px;border-radius:999px;cursor:pointer;font-family:'Caprasimo',serif;font-size:15px;\"\n      + (active ? \"background:var(--color-accent-2);color:#fff;border:2px solid var(--color-accent-2)\"\n                : \"background:transparent;color:var(--color-text);border:2px solid var(--color-divider)\");\n  }\n\n  setRsvp = (v) => this.setState(s => ({ rsvp: {...s.rsvp, [s.eventId]: v} }));\n  setEns = (tid, v) => this.setState(s => ({ ensaio: {...s.ensaio, [s.eventId + \"-\" + tid]: v} }));\n\n  pressKey = (k) => {\n    if (k === \"←\") return this.setState(s => ({ pin: s.pin.slice(0,-1), pinErr:false }));\n    if (k === \"OK\") {\n      if (this.state.pin === PIN) return this.setState({ orgUnlocked:true, screen:\"org\", pin:\"\", pinErr:false });\n      return this.setState({ pin:\"\", pinErr:true });\n    }\n    this.setState(s => (s.pin.length >= 4 ? {} : { pin: s.pin + k, pinErr:false }));\n  };\n\n  renderVals() {\n    const s = this.state, ev = this.ev();\n    const me = s.user;\n    const rsvp = s.rsvp[s.eventId] || null;\n    const q = s.query.trim().toLowerCase();\n    const meRec = MEMBERS.find(m => m.n === me);\n    const defRole = meRec ? { tanz: meRec.k === \"Tanz\", bateria: meRec.k === \"Bateria\" } : { tanz:false, bateria:false };\n    const role = s.evRole[s.eventId] || defRole;\n    const defInstr = meRec && meRec.k === \"Bateria\" ? [meRec.i] : [];\n    const myInstrs = s.evInstr[s.eventId] || defInstr;\n    const setRole = (patch) => this.setState(st => ({ evRole: {...st.evRole, [st.eventId]: {...role, ...patch}} }));\n    const roleParts = [];\n    if (role.tanz) roleParts.push(\"Tanz\");\n    if (role.bateria) roleParts.push(myInstrs.length ? \"Bateria (\" + myInstrs.join(\", \") + \")\" : \"Bateria\");\n    const myMeta = roleParts.length ? roleParts.join(\" · \") : \"noch offen\";\n\n    const members = MEMBERS.map((m, idx) => ({\n      name: m.n, initials: initials(m.n),\n      meta: m.k === \"Bateria\" ? \"Bateria · \" + m.i : \"Tanz\",\n      avatarBg: AV[idx % 3][0], avatarFg: AV[idx % 3][1],\n      pick: () => this.setState({ user: m.n, screen: \"events\" }),\n    }));\n\n    const shownEvents = s.events.filter(e => (s.tab === \"next\" ? !e.past : e.past)).map(e => ({\n      day: e.day, mon: e.mon, title: e.title, meta: joinDot(e.dateLabel, e.place),\n      pct: Math.round(((s.rsvp[e.id] === \"ja\" ? 1 : 0) / MEMBERS.length) * 100) + \"%\",\n      summary: (s.rsvp[e.id] === \"ja\" ? 1 : 0) + \"/\" + MEMBERS.length + \" Ja\",\n      dateBg: e.past ? \"var(--color-neutral-300)\" : \"var(--samba)\",\n      dateFg: e.past ? \"var(--color-neutral-800)\" : \"#3a2905\",\n      open: () => this.setState({ eventId: e.id, screen: \"detail\" }),\n    }));\n\n    const ensaios = ev.ensaios.map(t => {\n      const v = s.ensaio[s.eventId + \"-\" + t.id] || null;\n      return { label: probeLabel(t), sub: joinDot(t.time ? t.time + \" Uhr\" : \"\", t.place),\n        jaStyle: this.miniBtn(v === \"ja\", \"ja\"), neinStyle: this.miniBtn(v === \"nein\", \"nein\"), vielStyle: this.miniBtn(v === \"vielleicht\", \"viel\"),\n        setJa: () => this.setEns(t.id, \"ja\"), setNein: () => this.setEns(t.id, \"nein\"), setViel: () => this.setEns(t.id, \"vielleicht\") };\n    });\n\n    const dot = (v) => {\n      const map = {\n        ja: [\"var(--color-accent-2)\", \"#fff\", \"J\", \"Ja\"],\n        nein: [\"var(--color-neutral-300)\", \"var(--color-neutral-800)\", \"N\", \"Nein\"],\n        vielleicht: [\"var(--samba)\", \"#3a2905\", \"?\", \"Vielleicht\"],\n      };\n      const c = map[v] || [\"transparent\", \"var(--color-neutral-500)\", \"–\", \"Offen\"];\n      return { mark: c[2], title: c[3],\n        style: `width:24px;height:24px;border-radius:999px;display:grid;place-items:center;font:600 11px 'Figtree',system-ui;background:${c[0]};color:${c[1]};border:1px solid ${v ? \"transparent\" : \"var(--color-divider)\"}` };\n    };\n    const badge = (v) => {\n      const map = { ja:[\"var(--color-accent-2-200)\",\"var(--color-accent-2-800)\",\"Ja\"], nein:[\"var(--color-neutral-200)\",\"var(--color-neutral-800)\",\"Nein\"], vielleicht:[\"var(--samba-100)\",\"var(--samba-700)\",\"Vielleicht\"] };\n      const c = map[v] || [\"transparent\",\"var(--color-neutral-600)\",\"offen\"];\n      return { rsvpLabel: c[2], rsvpStyle: `flex:none;padding:4px 11px;border-radius:999px;font:600 11px 'Figtree',system-ui;background:${c[0]};color:${c[1]};border:1px solid ${v ? \"transparent\" : \"var(--color-divider)\"}` };\n    };\n\n    const nEns = ev.ensaios.length || 4;\n    const rows = MEMBERS.map((m, idx) => {\n      const own = me === m.n;\n      const r = own ? rsvp : RSVP_SEED[idx];\n      const b = badge(r);\n      const dots = ev.ensaios.map((t, j) => {\n        const v = own ? (s.ensaio[s.eventId + \"-\" + t.id] || null) : (ENS_SEED[idx][j] || null);\n        return dot(v);\n      });\n      return { name: own ? m.n + \" (du)\" : m.n, initials: initials(m.n),\n        meta: own ? myMeta : (m.k === \"Bateria\" ? \"Bateria · \" + m.i : \"Tanz\"),\n        avatarBg: AV[idx % 3][0], avatarFg: AV[idx % 3][1],\n        rsvpLabel: b.rsvpLabel, rsvpStyle: b.rsvpStyle, rsvpKey: r || \"offen\", dots };\n    });\n    const tally = (v) => rows.filter(r => r.rsvpLabel === v).length;\n\n    return {\n      isName: s.screen === \"name\", isSignup: s.screen === \"signup\", isEvents: s.screen === \"events\",\n      isDetail: s.screen === \"detail\", isOverview: s.screen === \"overview\",\n      isOrgLocked: s.screen === \"org\" && !s.orgUnlocked,\n      isOrgList: s.screen === \"org\" && s.orgUnlocked && s.orgView === \"list\",\n      isOrgForm: s.screen === \"org\" && s.orgUnlocked && s.orgView === \"form\",\n      orgFormTitle: s.orgNew ? \"Neues Event\" : \"Event bearbeiten\",\n      orgEventList: s.events.map(e => ({\n        title: e.title, dayLabel: e.day + \". \" + (e.mon || \"\"),\n        dayColor: e.past ? \"var(--color-neutral-600)\" : \"var(--color-accent-700)\",\n        sub: joinDot(e.dateLabel, e.place),\n        edit: () => this.setState({ orgView:\"form\", orgNew:false, orgEditId:e.id, form: this.formFrom(e), saved:false, orgEnsaios: (e.ensaios || []).map(t => ({...t})) }),\n      })),\n      newEvent: () => this.setState({ orgView:\"form\", orgNew:true, orgEditId:null, form:{...EMPTY_FORM}, orgEnsaios:[], saved:false }),\n      backToOrgList: () => this.setState({ orgView:\"list\", saved:false }),\n      f: s.form,\n      onF: Object.keys(EMPTY_FORM).reduce((acc, k) => {\n        acc[k] = (e) => { const v = e.target.value; this.setState(st => ({ form: {...st.form, [k]: v}, saved:false })); };\n        return acc;\n      }, {}),\n      showTabs: [\"events\",\"detail\",\"overview\",\"org\"].indexOf(s.screen) >= 0,\n      showUserChip: !!me && s.screen !== \"name\" && s.screen !== \"signup\",\n      userShort: me ? me.split(\" \")[0] : \"\",\n\n      query: s.query, onQuery: (e) => this.setState({ query: e.target.value }),\n      filteredMembers: q ? members.filter(m => m.name.toLowerCase().indexOf(q) >= 0) : members,\n\n      goName: () => this.setState({ screen: \"name\", query: \"\" }),\n      goSignup: () => this.go(\"signup\"), goEvents: () => this.go(\"events\"),\n      goOverview: () => this.go(\"overview\"),\n      goOrg: () => this.setState({ screen:\"org\", orgView:\"list\", saved:false }),\n      lockOrg: () => this.setState({ orgUnlocked:false, screen:\"events\", orgView:\"list\", saved:false }),\n\n      newName: s.newName, onNewName: (e) => this.setState({ newName: e.target.value }),\n      submitSignup: () => this.setState({ user: s.newName.trim() || \"Neues Mitglied\", screen: \"events\" }),\n\n      tab: s.tab, tabNext: () => this.setState({ tab:\"next\" }), tabPast: () => this.setState({ tab:\"past\" }),\n      tabNextStyle: this.pillTab(s.tab === \"next\"), tabPastStyle: this.pillTab(s.tab === \"past\"),\n      shownEvents,\n\n      ev, ensaios, evMeta: joinDot(ev.dateLabel, ev.place),\n      infoOpen: s.infoOpen, hasMaps: !!ev.maps,\n      infoToggleLabel: s.infoOpen ? \"Infos ausblenden\" : \"Alle Infos anzeigen\",\n      chevronStyle: s.infoOpen ? \"display:block;transform:rotate(180deg);transition:transform .18s\" : \"display:block;transition:transform .18s\",\n      toggleInfo: () => this.setState(st => ({ infoOpen: !st.infoOpen })),\n      hasProben: ev.ensaios.length > 0, noProben: ev.ensaios.length === 0,\n      probenHint: ev.ensaios.length > 0 ? \"Markiere jeden Probentermin einzeln.\" : \"Die Termine kommen von der Organisation.\",\n      roleHint: roleParts.length ? \"Für dieses Event: \" + myMeta + \".\" : \"Nur für dieses Event — Tanz, Bateria oder beides.\",\n      showInstr: role.bateria,\n      toggleTanz: () => setRole({ tanz: !role.tanz }),\n      toggleBateria: () => setRole({ bateria: !role.bateria }),\n      tanzStyle: this.choiceBtn(role.tanz), bateriaStyle: this.choiceBtn(role.bateria),\n      instrChoices: INSTRUMENTS.map(label => {\n        const on = myInstrs.indexOf(label) >= 0;\n        return { label,\n          pick: () => this.setState(st => {\n            const cur = st.evInstr[st.eventId] || defInstr;\n            const next = cur.indexOf(label) >= 0 ? cur.filter(x => x !== label) : cur.concat([label]);\n            return { evInstr: {...st.evInstr, [st.eventId]: next} };\n          }),\n          style: \"padding:9px 15px;min-height:40px;border-radius:999px;cursor:pointer;font:600 13px 'Figtree',system-ui;\"\n            + (on ? \"background:var(--color-accent);color:var(--color-bg);border:1.5px solid var(--color-accent)\"\n                  : \"background:var(--color-surface);color:var(--color-text);border:1.5px solid var(--color-divider)\"),\n        };\n      }),\n      rsvpHint: rsvp ? \"Deine Antwort ist gespeichert — du kannst sie jederzeit ändern.\" : \"Antworte bis spätestens eine Woche vorher.\",\n      jaStyle: this.bigBtn(rsvp === \"ja\", \"ja\"), neinStyle: this.bigBtn(rsvp === \"nein\", \"nein\"), vielStyle: this.bigBtn(rsvp === \"vielleicht\", \"viel\"),\n      setJa: () => this.setRsvp(\"ja\"), setNein: () => this.setRsvp(\"nein\"), setViel: () => this.setRsvp(\"vielleicht\"),\n      comment: s.comment[s.eventId] || \"\",\n      onComment: (e) => this.setState(st => ({ comment: {...st.comment, [st.eventId]: e.target.value} })),\n\n      overviewRows: s.ovFilter === \"alle\" ? rows : rows.filter(r => r.rsvpKey === s.ovFilter),\n      filterEmpty: s.ovFilter !== \"alle\" && rows.filter(r => r.rsvpKey === s.ovFilter).length === 0,\n      filters: [\n        { key:\"alle\", label:\"Alle \" + rows.length, tint:[\"var(--color-accent-200)\",\"var(--color-accent-800)\"] },\n        { key:\"ja\", label:\"Ja \" + tally(\"Ja\"), tint:[\"var(--color-accent-2-200)\",\"var(--color-accent-2-800)\"] },\n        { key:\"vielleicht\", label:\"Vielleicht \" + tally(\"Vielleicht\"), tint:[\"var(--samba-100)\",\"var(--samba-700)\"] },\n        { key:\"nein\", label:\"Nein \" + tally(\"Nein\"), tint:[\"var(--color-neutral-200)\",\"var(--color-neutral-800)\"] },\n        { key:\"offen\", label:\"Offen \" + tally(\"offen\"), tint:[\"var(--color-surface)\",\"var(--color-neutral-800)\"] },\n      ].map(f => {\n        const on = s.ovFilter === f.key;\n        return { label: f.label, pick: () => this.setState({ ovFilter: f.key }),\n          style: \"padding:7px 14px;min-height:36px;border-radius:999px;cursor:pointer;font:600 12.5px 'Figtree',system-ui;\"\n            + (on ? \"background:\" + f.tint[0] + \";color:\" + f.tint[1] + \";border:1.5px solid \" + f.tint[1]\n                  : \"background:transparent;color:var(--color-neutral-800);border:1.5px solid var(--color-divider)\") };\n      }),\n      labelJa: tally(\"Ja\") + \" Ja\", labelNein: tally(\"Nein\") + \" Nein\", labelViel: tally(\"Vielleicht\") + \" Vielleicht\", labelOpen: tally(\"offen\") + \" offen\",\n\n      pinDots: [0,1,2,3].map(i => ({ style: `width:13px;height:13px;border-radius:999px;background:${i < s.pin.length ? \"var(--color-accent)\" : \"transparent\"};border:1.5px solid ${s.pinErr ? \"var(--color-accent-600)\" : \"var(--color-divider)\"}` })),\n      pinMsg: s.pinErr ? \"Falscher PIN — nochmal versuchen.\" : \"Demo-PIN: 1312\",\n      pinMsgColor: s.pinErr ? \"var(--color-accent-700)\" : \"var(--color-neutral-700)\",\n      keypad: [\"1\",\"2\",\"3\",\"4\",\"5\",\"6\",\"7\",\"8\",\"9\",\"←\",\"0\",\"OK\"].map(k => ({\n        label: k, press: () => this.pressKey(k),\n        style: \"min-height:52px;border-radius:999px;cursor:pointer;font:600 17px 'Figtree',system-ui;\"\n          + (k === \"OK\" ? \"background:var(--color-accent);color:var(--color-bg);border:none\"\n             : k === \"←\" ? \"background:transparent;color:var(--color-neutral-700);border:1px solid var(--color-divider)\"\n             : \"background:var(--color-surface);color:var(--color-text);border:none\"),\n      })),\n\n      orgEnsaios: s.orgEnsaios.map((t, i) => {\n        const patch = (k) => (e) => { const v = e.target.value; this.setState(st => ({ orgEnsaios: st.orgEnsaios.map((x, j) => (j === i ? {...x, [k]: v} : x)), saved:false })); };\n        return { date: t.date || \"\", time: t.time || \"\", place: t.place || \"\",\n          onDate: patch(\"date\"), onTime: patch(\"time\"), onPlace: patch(\"place\"),\n          remove: () => this.setState(st => ({ orgEnsaios: st.orgEnsaios.filter((_, j) => j !== i), saved:false })) };\n      }),\n      addEnsaio: () => this.setState(st => ({ saved:false, orgEnsaios: st.orgEnsaios.concat([{ id: \"n\" + Date.now(), date:\"\", time:\"19:30\", place:\"Saal Weichselstraße\" }]) })),\n      saveOrg: this.commitEvent,\n      saveLabel: s.saved ? \"Gespeichert ✓\" : \"Event speichern\",\n\n      navEventsStyle: this.navBtn(s.screen === \"events\" || s.screen === \"detail\"),\n      navOverviewStyle: this.navBtn(s.screen === \"overview\"),\n      navOrgStyle: this.navBtn(s.screen === \"org\"),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
